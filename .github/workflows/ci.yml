name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system audio dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg portaudio19-dev
      - name: Install project and development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall main.py src scripts tests
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy main.py src scripts
      - name: Test without external model artifacts
        run: python -m pytest -m "not integration"
